[package]
name = "snmpify-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings of snmpify: SNMP v1/v2c/v3 client, traps, agent and MIBs with a Rust core."
license = "MIT"
repository = "https://github.com/snmp-rs/snmpify"
publish = false

[lib]
name = "_snmpify"
crate-type = ["cdylib"]

[dependencies]
snmpify = { path = ".." }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio = { version = "1.43.0", features = ["sync", "time", "rt-multi-thread"] }
