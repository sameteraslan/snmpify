# Test agent configuration: read-only "public", read-write "private" on
# a writable test variable, a fixed system group for exact assertions.
agentAddress udp:161
rocommunity public default
rwcommunity private default
sysLocation    snmpify test lab
# sysContact is left unset so that it is writable (SET tests).
sysName        snmpify-agent
sysServices    72
