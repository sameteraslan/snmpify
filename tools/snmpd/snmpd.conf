# Test agent configuration: read-only "public", read-write "private" on
# a writable test variable, a fixed system group for exact assertions.
agentAddress udp:161
rocommunity public default
rwcommunity private default
sysLocation    snmpify test lab
# sysContact is left unset so that it is writable (SET tests).
sysName        snmpify-agent
sysServices    72

# SNMPv3 users: every authentication protocol without privacy and with
# every privacy protocol. Name <auth>_<priv>, auth password "auth-<name>",
# privacy password "priv-<name>" (tests/netsnmp.rs builds the same).
createUser noauth
rwuser noauth noauth
createUser md5_none MD5 "auth-md5_none"
rwuser md5_none auth
createUser md5_des MD5 "auth-md5_des" DES "priv-md5_des"
rwuser md5_des priv
createUser md5_aes MD5 "auth-md5_aes" AES "priv-md5_aes"
rwuser md5_aes priv
createUser md5_aes192 MD5 "auth-md5_aes192" AES-192 "priv-md5_aes192"
rwuser md5_aes192 priv
createUser md5_aes256 MD5 "auth-md5_aes256" AES-256 "priv-md5_aes256"
rwuser md5_aes256 priv
createUser sha_none SHA "auth-sha_none"
rwuser sha_none auth
createUser sha_des SHA "auth-sha_des" DES "priv-sha_des"
rwuser sha_des priv
createUser sha_aes SHA "auth-sha_aes" AES "priv-sha_aes"
rwuser sha_aes priv
createUser sha_aes192 SHA "auth-sha_aes192" AES-192 "priv-sha_aes192"
rwuser sha_aes192 priv
createUser sha_aes256 SHA "auth-sha_aes256" AES-256 "priv-sha_aes256"
rwuser sha_aes256 priv
createUser sha224_none SHA-224 "auth-sha224_none"
rwuser sha224_none auth
createUser sha224_des SHA-224 "auth-sha224_des" DES "priv-sha224_des"
rwuser sha224_des priv
createUser sha224_aes SHA-224 "auth-sha224_aes" AES "priv-sha224_aes"
rwuser sha224_aes priv
createUser sha224_aes192 SHA-224 "auth-sha224_aes192" AES-192 "priv-sha224_aes192"
rwuser sha224_aes192 priv
createUser sha224_aes256 SHA-224 "auth-sha224_aes256" AES-256 "priv-sha224_aes256"
rwuser sha224_aes256 priv
createUser sha256_none SHA-256 "auth-sha256_none"
rwuser sha256_none auth
createUser sha256_des SHA-256 "auth-sha256_des" DES "priv-sha256_des"
rwuser sha256_des priv
createUser sha256_aes SHA-256 "auth-sha256_aes" AES "priv-sha256_aes"
rwuser sha256_aes priv
createUser sha256_aes192 SHA-256 "auth-sha256_aes192" AES-192 "priv-sha256_aes192"
rwuser sha256_aes192 priv
createUser sha256_aes256 SHA-256 "auth-sha256_aes256" AES-256 "priv-sha256_aes256"
rwuser sha256_aes256 priv
createUser sha384_none SHA-384 "auth-sha384_none"
rwuser sha384_none auth
createUser sha384_des SHA-384 "auth-sha384_des" DES "priv-sha384_des"
rwuser sha384_des priv
createUser sha384_aes SHA-384 "auth-sha384_aes" AES "priv-sha384_aes"
rwuser sha384_aes priv
createUser sha384_aes192 SHA-384 "auth-sha384_aes192" AES-192 "priv-sha384_aes192"
rwuser sha384_aes192 priv
createUser sha384_aes256 SHA-384 "auth-sha384_aes256" AES-256 "priv-sha384_aes256"
rwuser sha384_aes256 priv
createUser sha512_none SHA-512 "auth-sha512_none"
rwuser sha512_none auth
createUser sha512_des SHA-512 "auth-sha512_des" DES "priv-sha512_des"
rwuser sha512_des priv
createUser sha512_aes SHA-512 "auth-sha512_aes" AES "priv-sha512_aes"
rwuser sha512_aes priv
createUser sha512_aes192 SHA-512 "auth-sha512_aes192" AES-192 "priv-sha512_aes192"
rwuser sha512_aes192 priv
createUser sha512_aes256 SHA-512 "auth-sha512_aes256" AES-256 "priv-sha512_aes256"
rwuser sha512_aes256 priv

# AgentX master for tests/netsnmp_agent.rs: subagents connect over TCP
# (published on 127.0.0.1:1705); their notifications go to a receiver
# the test runs on the docker host.
master agentx
agentXSocket tcp:0.0.0.0:705
agentXTimeout 5
trap2sink 172.17.0.1:11620 public
