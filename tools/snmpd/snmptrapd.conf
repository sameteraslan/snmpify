# Test notification receiver (tests/netsnmp_notifications.rs): logs every
# trap and inform it accepts to stdout.
snmpTrapdAddr udp:162
authCommunity log public
# SNMPv3: informs go to snmptrapd's own engine; traps come from the
# sender's engine (the fixed id the tests use for traps).
createUser trapuser SHA-256 "trap-auth-pass" AES "trap-priv-pass"
createUser -e 0x80000000057465737473656e64 trapuser SHA-256 "trap-auth-pass" AES "trap-priv-pass"
authUser log trapuser priv
