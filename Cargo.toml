[package]
name = "snmpify"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Fast SNMP for Rust: BER codec, v1/v2c/v3 messages, async client and trap receiver, with Python and C/C++ bindings."
license = "MIT"
repository = "https://github.com/snmp-rs/snmpify"
documentation = "https://docs.rs/snmpify"
readme = "README.md"
exclude = [".github/"]
keywords = ["snmp", "network", "monitoring", "mib", "netsnmp"]
categories = ["network-programming", "encoding", "parser-implementations"]

[workspace]
members = [".", "python", "capi"]
exclude = ["benchmarks"]
# MSRV-aware dependency resolution (picks versions that build on 1.85).
resolver = "3"

[features]
default = ["client"]
# The async client (tokio), SNMPv1/v2c/v3.
client = ["dep:tokio", "v3"]
# SNMPv3 security (USM): key localisation, HMAC authentication, DES/AES
# privacy. Without it and `client`, only the wire format (no dependencies).
v3 = ["dep:hmac", "dep:md-5", "dep:sha1", "dep:sha2", "dep:aes", "dep:des"]

[dependencies]
hmac = { version = "0.13", optional = true }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
aes = { version = "0.9", optional = true }
des = { version = "0.9", optional = true }
tokio = { version = "1.44", features = ["net", "time", "sync", "rt", "rt-multi-thread", "io-util", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[[test]]
name = "client_fake_agent"
required-features = ["client"]

[[test]]
name = "v3_fake_agent"
required-features = ["client"]

[[test]]
name = "decode_robustness"
required-features = ["v3"]

[[example]]
name = "walk"
required-features = ["client"]

[[example]]
name = "codec_bench"
required-features = ["v3"]

[[test]]
name = "notifications"
required-features = ["client"]

[[test]]
name = "netsnmp_notifications"
required-features = ["client"]

[[test]]
name = "agent"
required-features = ["client"]

[[test]]
name = "netsnmp_agent"
required-features = ["client"]

[[example]]
name = "gen_builtin_mibs"
