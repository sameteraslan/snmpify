version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its tags name Rust toolchains (the MSRV pin), not action versions.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /tools/snmpd
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
