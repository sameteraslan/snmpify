name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, robustness, doc)
        run: cargo test --verbose
      - name: Tests without the client (wire format only, and with USM)
        run: |
          cargo test --no-default-features
          cargo test --no-default-features --features v3
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and test on the minimum supported Rust version
        run: cargo test

  netsnmp:
    # Interoperability with net-snmp's snmpd (tools/snmpd).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start snmpd
        run: |
          docker build -t snmpify-snmpd tools/snmpd
          docker run -d --name snmpify-snmpd -p 127.0.0.1:1161:161/udp -p 127.0.0.1:1161:161/tcp -p 127.0.0.1:1705:705/tcp snmpify-snmpd
          docker run -d --name snmpify-snmptrapd -p 127.0.0.1:1162:162/udp \
            --entrypoint /usr/sbin/snmptrapd snmpify-snmpd -f -Lo -C -c /etc/snmp/snmptrapd.conf
          sleep 2
      - name: Tests against snmpd and snmptrapd
        run: cargo test --test netsnmp --test netsnmp_notifications --test netsnmp_agent -- --nocapture
        env:
          SNMPIFY_AGENT: 127.0.0.1:1161
          SNMPIFY_TRAPD: 127.0.0.1:1162
          SNMPIFY_AGENTX: 127.0.0.1:1705
      - name: snmpd and snmptrapd logs
        if: failure()
        run: |
          docker logs snmpify-snmpd
          docker logs snmpify-snmptrapd

  c-api:
    # The C/C++ API (capi/): Rust-driven tests, CMake build and CTest on
    # Linux, macOS and Windows; on Linux also install + consumers (CMake
    # package and pkg-config, shared and static) and the tests against snmpd.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (snmpify-c)
        if: runner.os == 'Linux'
        run: cargo clippy -p snmpify-c --all-targets -- -D warnings
      - name: Start snmpd
        if: runner.os == 'Linux'
        run: |
          docker build -t snmpify-snmpd tools/snmpd
          docker run -d --name snmpify-snmpd -p 127.0.0.1:1161:161/udp snmpify-snmpd
          sleep 2
          echo "SNMPIFY_AGENT=127.0.0.1:1161" >> "$GITHUB_ENV"
      - name: Rust-driven tests (C and C++ programs on the static library)
        if: runner.os != 'Windows'
        run: cargo test -p snmpify-c -- --nocapture
      - name: CMake build and CTest
        shell: bash
        run: |
          cmake -S capi -B build-capi -DSNMPIFY_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install-capi"
          cmake --build build-capi --config Release -j 4
          ctest --test-dir build-capi -C Release --output-on-failure
      - name: Install, then build against the CMake package and pkg-config
        if: runner.os == 'Linux'
        run: |
          cmake --install build-capi
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(consumer C CXX)
          find_package(snmpify 0.1 REQUIRED)
          add_executable(get ../capi/examples/get.c)
          target_link_libraries(get PRIVATE snmpify::snmpify)
          add_executable(walk ../capi/examples/walk.cpp)
          set_target_properties(walk PROPERTIES CXX_STANDARD 17)
          target_link_libraries(walk PRIVATE snmpify::static)
          CMAKE
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/install-capi"
          cmake --build consumer/build
          consumer/build/get 127.0.0.1:1161 public sysName.0 | grep -q 'sysName.0 = snmpify-agent'
          consumer/build/walk 127.0.0.1:1161 public IF-MIB::ifDescr | grep -q 'ifDescr.1 = lo'
          export PKG_CONFIG_PATH="$PWD/install-capi/lib/pkgconfig"
          cc -std=c99 capi/examples/get.c $(pkg-config --cflags --libs snmpify) -Wl,-rpath,"$PWD/install-capi/lib" -o consumer/get-pc
          consumer/get-pc 127.0.0.1:1161 public sysName.0
          cc -std=c99 capi/examples/trapd.c $(pkg-config --cflags snmpify) install-capi/lib/libsnmpify.a \
            $(pkg-config --libs-only-l --static snmpify | sed 's/-lsnmpify//') -o consumer/trapd-static

  coverage:
    # Line coverage of every test, the snmpd interop tests included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - name: Start snmpd
        run: |
          docker build -t snmpify-snmpd tools/snmpd
          docker run -d --name snmpify-snmpd -p 127.0.0.1:1161:161/udp -p 127.0.0.1:1161:161/tcp -p 127.0.0.1:1705:705/tcp snmpify-snmpd
          docker run -d --name snmpify-snmptrapd -p 127.0.0.1:1162:162/udp \
            --entrypoint /usr/sbin/snmptrapd snmpify-snmpd -f -Lo -C -c /etc/snmp/snmptrapd.conf
          sleep 2
      - name: Measure
        env:
          SNMPIFY_AGENT: 127.0.0.1:1161
          SNMPIFY_TRAPD: 127.0.0.1:1162
          SNMPIFY_AGENTX: 127.0.0.1:1705
        run: |
          cargo llvm-cov --all-targets --lcov --output-path lcov.info
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  fuzz:
    # A short libFuzzer run on every change; longer runs locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the message decoder for 60 s
        run: cargo fuzz run decode_message -- -max_total_time=60
