name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, robustness, doc)
        run: cargo test --verbose
      - name: Tests without the client (wire format only, and with USM)
        run: |
          cargo test --no-default-features
          cargo test --no-default-features --features v3
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and test on the minimum supported Rust version
        run: cargo test

  netsnmp:
    # Interoperability with net-snmp's snmpd (tools/snmpd).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start snmpd
        run: |
          docker build -t snmpify-snmpd tools/snmpd
          docker run -d --name snmpify-snmpd -p 127.0.0.1:1161:161/udp snmpify-snmpd
          docker run -d --name snmpify-snmptrapd -p 127.0.0.1:1162:162/udp \
            --entrypoint /usr/sbin/snmptrapd snmpify-snmpd -f -Lo -C -c /etc/snmp/snmptrapd.conf
          sleep 2
      - name: Tests against snmpd and snmptrapd
        run: cargo test --test netsnmp --test netsnmp_notifications -- --nocapture
        env:
          SNMPIFY_AGENT: 127.0.0.1:1161
          SNMPIFY_TRAPD: 127.0.0.1:1162
      - name: snmpd and snmptrapd logs
        if: failure()
        run: |
          docker logs snmpify-snmpd
          docker logs snmpify-snmptrapd

  coverage:
    # Line coverage of every test, the snmpd interop tests included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - name: Start snmpd
        run: |
          docker build -t snmpify-snmpd tools/snmpd
          docker run -d --name snmpify-snmpd -p 127.0.0.1:1161:161/udp snmpify-snmpd
          docker run -d --name snmpify-snmptrapd -p 127.0.0.1:1162:162/udp \
            --entrypoint /usr/sbin/snmptrapd snmpify-snmpd -f -Lo -C -c /etc/snmp/snmptrapd.conf
          sleep 2
      - name: Measure
        env:
          SNMPIFY_AGENT: 127.0.0.1:1161
          SNMPIFY_TRAPD: 127.0.0.1:1162
        run: |
          cargo llvm-cov --all-targets --lcov --output-path lcov.info
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  fuzz:
    # A short libFuzzer run on every change; longer runs locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the message decoder for 60 s
        run: cargo fuzz run decode_message -- -max_total_time=60
